services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: traceforge-db
    ports:
      - "6379:6379"
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - falkordb_data:/var/lib/falkordb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceforge-backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=traceforge
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - falkordb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceforge-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
